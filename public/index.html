<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>盛和塾签到</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#431019 0%,#5a151c 46%,#741f28 100%);min-height:100vh;color:#2e1719}
.container{max-width:460px;margin:0 auto;padding:18px 16px 28px}
.header{text-align:center;padding:12px 0 18px;color:#fff}
.brand-lockup{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:18px;background:#f7f1e8;box-shadow:0 10px 24px rgba(25,5,8,.22);color:#881b1b}
.brand-seal{width:40px;height:40px;display:grid;place-items:center;border:2px solid #881b1b;border-radius:12px;font-size:22px;font-weight:800;line-height:1}
.header .brand{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:4px}
.header .brand-region{font-size:11px;letter-spacing:3px;margin-top:4px;color:#6e3535;text-align:left}
.header .motto{font-size:12px;color:#f5d9d2;letter-spacing:3px;margin-top:13px}
.header h1{font-size:20px;font-weight:700;margin:16px 0 0;color:#fff}
.activity-shell{display:none;margin:0 0 16px;padding:16px;border-radius:18px;background:#f7f1e8;box-shadow:0 12px 28px rgba(25,5,8,.18)}
.activity-shell.show{display:block}
.activity-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#5b181d}
.activity-heading strong{font-size:17px}
.activity-heading span{font-size:12px;color:#9a5d5d}
.activity-list{display:grid;gap:10px}
.activity-card{width:100%;padding:13px 14px;text-align:left;border:1px solid #ead9d2;border-radius:14px;background:#fffaf4;color:#3e2021;cursor:pointer;transition:.18s ease;box-shadow:0 4px 12px rgba(90,21,28,.06)}
.activity-card:hover,.activity-card.selected{border-color:#a43a40;background:#fff3ed;box-shadow:0 6px 16px rgba(136,27,27,.14)}
.activity-card .activity-top{display:flex;align-items:center;gap:8px}
.activity-card .activity-dot{width:9px;height:9px;border-radius:50%;background:#a8a09a;flex:0 0 auto}
.activity-card.open .activity-dot{background:#2c9b68;box-shadow:0 0 0 4px rgba(44,155,104,.12)}
.activity-card .activity-name{font-size:15px;font-weight:700;flex:1;min-width:0}
.activity-card .activity-state{font-size:12px;color:#846363;white-space:nowrap}
.activity-card.open .activity-state{color:#228153;font-weight:700}
.activity-card .activity-meta{font-size:12px;color:#8a6a6a;margin:7px 0 0 17px}
.activity-card .activity-action{font-size:12px;color:#9b3538;margin:8px 0 0 17px}
.card{background:#f7f1e8;border-radius:20px;padding:22px;margin-bottom:16px;border:1px solid rgba(255,255,255,.45);box-shadow:0 12px 28px rgba(25,5,8,.18)}
.card h3{font-size:17px;margin-bottom:16px;color:#5b181d}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:13px;color:#805b5b;margin-bottom:6px}
.input-group input{width:100%;padding:14px 16px;border-radius:11px;border:1px solid #ddc9c3;background:#fffaf4;color:#3b2020;font-size:16px;outline:none}
.input-group input:focus{border-color:#a43a40;background:#fff}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#8d242b,#68151d);color:#fff8f0;letter-spacing:1px;box-shadow:0 8px 16px rgba(104,21,29,.2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.multi-panel{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#fff8f2;border:1px solid #ead9d2}
.multi-panel.show{display:block}
.multi-panel .tip{font-size:14px;line-height:1.6;color:#795858;margin-bottom:10px}
.multi-panel select{width:100%;padding:12px;border-radius:8px;border:1px solid #ddc9c3;background:#fff;color:#3b2020;font-size:16px;margin-bottom:10px}
.multi-panel .btn{padding:12px;font-size:15px}
.identity-tip{font-size:13px;line-height:1.6;color:#795858;margin:-6px 0 14px}
.text-btn{display:block;width:100%;margin-top:10px;padding:8px;border:0;background:transparent;color:#8d242b;font-size:13px;cursor:pointer}
.candidate-list{display:grid;gap:10px}
.candidate-card{width:100%;padding:12px;text-align:left;border:1px solid #d8b5ae;border-radius:10px;background:#fff;color:#3e2021;cursor:pointer}
.candidate-card:disabled{opacity:.55;cursor:default}
.candidate-card .candidate-name{font-size:16px;font-weight:700;margin-bottom:4px}
.candidate-card .candidate-meta{font-size:13px;line-height:1.6;color:#795858}
.msg{margin-top:14px;padding:14px 16px;border-radius:10px;font-size:14px;text-align:center;display:none}
.msg.show{display:block}
.msg.success{background:#e7f4ec;color:#237b50}
.msg.error{background:#fbe5e3;color:#a23737}
.result-card{background:#f7f1e8;border:1px solid #e2c8c1;border-radius:16px;padding:24px 20px;text-align:center;display:none}
.result-card.show{display:block}
.result-card .check-icon{font-size:56px;margin-bottom:8px}
.result-card .welcome{font-size:20px;font-weight:700;margin-bottom:12px;color:#2c8558}
.result-card .seat-item{font-size:22px;font-weight:700;color:#8d242b;margin:6px 0;padding:10px 16px;background:#f7e4dc;border-radius:10px;display:inline-block}
.result-card .seat-item:empty{display:none}
.result-card .info{font-size:13px;color:#795858;line-height:1.6;margin-top:8px}
.loading{text-align:center;padding:60px 20px;color:#f5d9d2}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:#f7f1e8;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:10px;font-size:11px;color:#f0cbc2}
.footer a{color:#f0cbc2}
</style>
</head>
<body>
<div class="container">
  <div id="loadingArea" class="loading"><div class="spinner"></div><div>加载中...</div></div>
  <div id="mainArea" style="display:none">
    <div class="header">
      <div class="brand-lockup" aria-label="盛和塾｜苏州">
        <div class="brand-seal">盛</div>
        <div><div class="brand">盛和塾</div><div class="brand-region">苏州 · SIGN IN</div></div>
      </div>
      <div class="motto">提高心性 拓展经营</div>
      <h1 id="eventName">活动签到</h1>
      <div class="activity-shell" id="activityShell">
        <div class="activity-heading"><strong>今日签到活动</strong><span id="activityCount"></span></div>
        <div class="activity-list" id="activeEvents"></div>
      </div>
    </div>
    <div class="card" id="formCard">
      <h3>&#x270d;&#xfe0f; 签到</h3>
      <div class="identity-tip" id="identityTip"></div>
      <div class="input-group"><label>姓名</label><input type="text" id="nameInput" placeholder="请输入报名时的姓名"></div>
      <div class="input-group" id="phoneInputGroup" style="display:none"><label>手机号</label><input type="tel" id="phoneInput" placeholder="请输入11位手机号" maxlength="11"></div>
      <button class="btn" id="submitBtn" onclick="doCheckin()">&#x2713; 查找我的报名</button>
      <button class="text-btn" id="phoneAssistBtn" onclick="showPhoneAssist()" style="display:none">找不到自己？使用手机号辅助查找</button>
      <div class="multi-panel" id="candidatePanel">
        <div class="tip" id="candidateText">找到多位同名学长，请选择您本人：</div>
        <div class="candidate-list" id="candidateList"></div>
      </div>
      <div class="multi-panel" id="eventPanel">
        <div class="tip">您报名了多个开放活动，请选择本次签到活动：</div>
        <select id="eventSelect"></select>
        <button class="btn" id="eventBtn" onclick="confirmEventCheckin()">确认活动</button>
      </div>
      <div class="multi-panel" id="multiPanel">
        <div class="tip" id="multiText"></div>
        <select id="quantitySelect"></select>
        <button class="btn" id="multiBtn" onclick="confirmMultiCheckin()">确认本次到场人数</button>
      </div>
      <div class="msg" id="msgBox"></div>
    </div>
    <div class="result-card" id="resultCard">
      <div class="check-icon">&#x2705;</div>
      <div class="welcome" id="welcomeText"></div>
      <div id="seatArea"></div>
      <div class="info" id="resultInfo"></div>
    </div>
    <div class="footer"><a href="/admin.html">&#x1f512; 管理后台</a></div>
  </div>
</div>
<script>
var API="https://shengheshu-d2g2zyyl99f6c6fc2-1453587887.ap-shanghai.app.tcloudbase.com/api";
var pendingName="",pendingPhone="",pendingEventId="",eventRefreshTimer=null,checkinMode="phone",phoneAssistActive=false,nameCandidates=[],activityGroups=[],activityDisplayEvents=[],activityResponse=null,selectedActivityEventId="";
function formatChinaDateTime(value, options){
  var date=new Date(value);if(isNaN(date.getTime()))return "";
  return date.toLocaleString("zh-CN",Object.assign({timeZone:"Asia/Shanghai"},options||{}));
}
function formatChinaTime(value){return formatChinaDateTime(value,{hour:"2-digit",minute:"2-digit",hour12:false});}

function hideCandidatePanel(){nameCandidates=[];document.getElementById("candidatePanel").classList.remove("show");document.getElementById("candidateList").innerHTML="";}

function configureCheckinMode(d,hasActiveEvents,nextEvent,selectedEvent){
  var classAvailable=selectedEvent?selectedEvent.activity_type==="class_meeting":Boolean(d.class_meeting_available);
  if(!phoneAssistActive) checkinMode=classAvailable?"name":"phone";
  var classMode=checkinMode==="name";
  var tip=document.getElementById("identityTip"),phoneGroup=document.getElementById("phoneInputGroup"),assist=document.getElementById("phoneAssistBtn"),submit=document.getElementById("submitBtn");
  if(classMode){
    tip.textContent="班会签到请输入姓名，系统会自动匹配报名记录。";
    phoneGroup.style.display="none";
    assist.style.display=hasActiveEvents?"block":"none";
  }else{
    tip.textContent=phoneAssistActive?"手机号仅用于辅助查找，不会改变班会报名记录。":"请输入姓名和手机号完成签到。";
    phoneGroup.style.display=hasActiveEvents?"block":"none";
    document.getElementById("phoneLabel").textContent=phoneAssistActive?"手机号（辅助查找）":"手机号";
    assist.style.display="none";
  }
  document.getElementById("nameInput").disabled=!hasActiveEvents;
  document.getElementById("phoneInput").disabled=!hasActiveEvents;
  submit.disabled=!hasActiveEvents;
  submit.textContent=hasActiveEvents?(classMode?"查找我的报名":"确认签到"):(nextEvent?"尚未到签到时间":"当前暂无开放签到的活动");
}

function activityName(item){
  var name=String(item&&item.name||"盛和塾活动"),session=String(item&&item.session_name||"").trim(),suffix=session?" - "+session:"";
  return suffix&&name.slice(-suffix.length)===suffix?name.slice(0,-suffix.length):name;
}
function activityTime(item){
  var start=item&&item.checkin_start_at?formatChinaTime(item.checkin_start_at):"",end=item&&item.checkin_end_at?formatChinaTime(item.checkin_end_at):"";
  var session=item&&item.session_name?String(item.session_name):"";
  if(start&&end)return (session?session+" · ":"")+start+"–"+end;
  return session||"时间待定";
}
function activityState(item){
  if(item&&item.checkin_status==="open")return "当前可签到";
  if(item&&item.checkin_status==="upcoming")return (item.checkin_start_at?formatChinaTime(item.checkin_start_at)+" 开放":"尚未开放");
  return "暂不可签到";
}
function renderActivityCards(events,activeEvents,nextEvent,response){
  activityDisplayEvents=events||[];activityResponse=response||activityResponse||{};
  var groupsByKey={};
  activityDisplayEvents.forEach(function(item){var key=String(item.event_group_id||item.event_id||"");(groupsByKey[key]||(groupsByKey[key]=[])).push(item);});
  activityGroups=Object.keys(groupsByKey).map(function(key){
    var rows=groupsByKey[key].slice().sort(function(a,b){return Number(a.session_order||0)-Number(b.session_order||0)||String(a.checkin_start_at||"").localeCompare(String(b.checkin_start_at||""));});
    var selected=rows.find(function(row){return String(row.event_id)===String(selectedActivityEventId);})||rows.find(function(row){return row.checkin_status==="open";})||rows.find(function(row){return row.checkin_status==="upcoming";})||rows[0];
    return {key:key,rows:rows,selected:selected};
  });
  var shell=document.getElementById("activityShell"),list=document.getElementById("activeEvents");
  if(!activityGroups.length){shell.classList.remove("show");list.innerHTML="";selectedActivityEventId="";configureCheckinMode(activityResponse,false,nextEvent,null);return;}
  var selectedGroup=activityGroups.find(function(group){return group.rows.some(function(row){return String(row.event_id)===String(selectedActivityEventId);});})||activityGroups[0];
  selectedActivityEventId=String(selectedGroup.selected.event_id||"");
  document.getElementById("activityCount").textContent=activityGroups.length+"场";
  list.innerHTML="";
  activityGroups.forEach(function(group){
    var item=group.selected,isSelected=String(item.event_id)===String(selectedActivityEventId),button=document.createElement("button");
    button.type="button";button.className="activity-card"+(item.checkin_status==="open"?" open":"")+(isSelected?" selected":"");
    var sessionExtra=group.rows.length>1?" · 今日"+group.rows.length+"个场次":"";
    button.innerHTML='<div class="activity-top"><span class="activity-dot"></span><span class="activity-name">'+esc(activityName(item))+'</span><span class="activity-state">'+esc(activityState(item))+'</span></div><div class="activity-meta">'+esc(activityTime(item)+sessionExtra)+'</div><div class="activity-action">'+(isSelected?(item.checkin_status==="open"?"已选择 · 进入签到":"已选择 · 尚未开放"):"选择此活动")+' ›</div>';
    button.addEventListener("click",function(){selectActivityGroup(group.key);});
    list.appendChild(button);
  });
  shell.classList.add("show");
  var selectedEvent=selectedGroup.selected,selectedOpen=selectedEvent&&selectedEvent.checkin_status==="open";
  configureCheckinMode(activityResponse,Boolean(selectedOpen),selectedEvent||nextEvent);
}
function selectActivityGroup(key){
  var group=activityGroups.find(function(item){return String(item.key)===String(key);});
  if(!group)return;
  selectedActivityEventId=String(group.selected.event_id||"");
  hideCandidatePanel();
  document.getElementById("eventPanel").classList.remove("show");
  document.getElementById("multiPanel").classList.remove("show");
  renderActivityCards(activityDisplayEvents,activityResponse&&activityResponse.active_events||[],activityResponse&&activityResponse.next_event,activityResponse);
}

async function init(){
  try{
    var r=await fetch(API+"/event");var d=await r.json();
    document.getElementById("eventName").textContent="活动签到";
    var activeEvents=(d.active_events||[]).slice(),displayEvents=(d.display_events||activeEvents).slice().sort(function(a,b){return String(a.checkin_start_at||"").localeCompare(String(b.checkin_start_at||""))||Number(a.session_order||0)-Number(b.session_order||0)||String(a.name||"").localeCompare(String(b.name||""));}),nextEvent=d.next_event||null;
    renderActivityCards(displayEvents,activeEvents,nextEvent,d);
    var hasActiveEvents=Number(d.active_event_count||0)>0;
    if(eventRefreshTimer)clearInterval(eventRefreshTimer);
    eventRefreshTimer=displayEvents.length?setInterval(init,25000):null;
    document.getElementById("loadingArea").style.display="none";
    document.getElementById("mainArea").style.display="block";
  }catch(e){document.getElementById("loadingArea").innerHTML='<div style="color:#f87171">⚠️ 加载失败</div><div style="font-size:12px">请刷新重试</div>'}
}

function m(t,ty){var e=document.getElementById("msgBox");e.textContent=t;e.className="msg show "+ty;setTimeout(function(){e.classList.remove("show")},3000)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}

async function doCheckin(){
  var name=document.getElementById("nameInput").value.trim();
  if(!name){m("请输入姓名","error");return}
  pendingName=name;
  if(checkinMode==="name"){
    await lookupName();
    return;
  }
  var phone=document.getElementById("phoneInput").value.trim().replace(/\s/g,"").replace(/-/g,"");
  if(!phone){m("请输入手机号","error");return}
  if(phone.length!==11||!/^\d+$/.test(phone)){m("请输入正确的11位手机号","error");return}
  pendingPhone=phone;
  pendingEventId=selectedActivityEventId||"";
  document.getElementById("eventPanel").classList.remove("show");
  document.getElementById("multiPanel").classList.remove("show");
  hideCandidatePanel();
  await submitCheckin(null);
}

function showPhoneAssist(){
  phoneAssistActive=true;checkinMode="phone";
  document.getElementById("phoneInputGroup").style.display="block";
  document.getElementById("phoneLabel").textContent="手机号（辅助查找）";
  document.getElementById("phoneAssistBtn").style.display="none";
  document.getElementById("identityTip").textContent="手机号仅用于辅助查找，不会改变班会报名记录。";
  document.getElementById("submitBtn").textContent="确认签到";
  document.getElementById("phoneInput").focus();
}

async function lookupName(){
  var btn=document.getElementById("submitBtn"),originalText=btn.textContent;
  btn.disabled=true;btn.textContent="查找中...";hideCandidatePanel();
  try{
    var r=await fetch(API+"/checkin/lookup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pendingName,event_id:selectedActivityEventId||""})});
    var d=await r.json();
    if(d.status==="UNIQUE"){await confirmNameCandidate((d.candidates||[])[0]);}
    else if(d.status==="MULTIPLE"){renderCandidates(d.candidates||[]);m("找到多位同名学长，请选择您本人","success");}
    else{m(d.msg||"没有找到这个姓名","error");if(d.phone_assist)document.getElementById("phoneAssistBtn").style.display="block";}
  }catch(e){m("网络错误，请稍后重试","error");}
  btn.disabled=false;btn.textContent=checkinMode==="name"?originalText:"确认签到";
}

function renderCandidates(candidates){
  nameCandidates=candidates||[];
  var list=document.getElementById("candidateList");list.innerHTML="";
  nameCandidates.forEach(function(candidate,index){
    var button=document.createElement("button");button.type="button";button.className="candidate-card";
    var meta=[];
    if(candidate.company)meta.push(candidate.company);
    if(candidate.center)meta.push(candidate.center);
    if(candidate.class_name)meta.push(candidate.class_name);
    if(candidate.group_name)meta.push(candidate.group_name);
    if(candidate.phone_last4)meta.push("手机号后4位 "+candidate.phone_last4);
    if(candidate.event&&candidate.event.name)meta.push(candidate.event.name);
    button.innerHTML='<div class="candidate-name">'+esc(candidate.name)+(candidate.checked_in?'（已签到）':'')+'</div><div class="candidate-meta">'+esc(meta.join(" · "))+'</div>';
    button.disabled=Boolean(candidate.checked_in);
    button.addEventListener("click",function(){confirmNameCandidate(nameCandidates[index]);});
    list.appendChild(button);
  });
  document.getElementById("candidatePanel").classList.add("show");
}

async function confirmNameCandidate(candidate){
  if(!candidate||!candidate.registration_id||!candidate.event_id){m("报名信息不完整，请重新查询","error");return}
  var btn=document.getElementById("submitBtn"),originalText=btn.textContent;
  btn.disabled=true;btn.textContent="签到中...";
  try{
    var r=await fetch(API+"/checkin/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_id:candidate.event_id,registration_id:candidate.registration_id})});
    var d=await r.json();
    if(d.ok)showSuccess(d);else m(d.msg||"签到失败","error");
  }catch(e){m("网络错误，请稍后重试","error");}
  btn.disabled=false;btn.textContent=originalText;
}

async function confirmMultiCheckin(){
  var quantity=parseInt(document.getElementById("quantitySelect").value,10);
  if(!quantity){m("请选择本次到场人数","error");return}
  await submitCheckin(quantity);
}

async function confirmEventCheckin(){
  pendingEventId=document.getElementById("eventSelect").value;
  if(!pendingEventId){m("请选择本次签到活动","error");return}
  document.getElementById("eventPanel").classList.remove("show");
  await submitCheckin(null);
}

function showSuccess(d){
  document.getElementById("formCard").style.display="none";
  hideCandidatePanel();
  document.getElementById("multiPanel").classList.remove("show");
  document.getElementById("eventPanel").classList.remove("show");
  document.getElementById("phoneAssistBtn").style.display="none";
  document.getElementById("resultCard").classList.add("show");
  document.getElementById("welcomeText").textContent="欢迎 "+d.data.name+"学长！";
  var shGrp=d.data.show_group!=="false",shDin=d.data.show_dinner_table!=="false";
  var seatHtml="";
  if(shGrp && d.data.group_num) seatHtml+='<div class="seat-item">大会现场：第 '+d.data.group_num+' 组</div>';
  if(shDin && d.data.dinner_table_num) seatHtml+='<div class="seat-item">空巴晚宴：第 '+d.data.dinner_table_num+' 桌</div>';
  document.getElementById("seatArea").innerHTML=seatHtml;
  var info="";
  if(d.data.event) info+="活动："+esc(d.data.event.event_date+" · "+d.data.event.activity_type_name+" · "+d.data.event.name)+"<br>";
  if(d.data.group_value) info+=esc(d.data.group_type||"分组")+"："+esc(d.data.group_value)+"<br>";
  else if(d.data.class_name) info+="班级："+esc(d.data.class_name)+"<br>";
  else if(d.data.center) info+="分中心："+esc(d.data.center)+"<br>";
  else if(d.data.group_name) info+="小组："+esc(d.data.group_name)+"<br>";
  if(d.data.company) info+="公司："+esc(d.data.company);
  if(d.data.multi_total>1) info+=(info?"<br>":"")+"多人报名：已签到 "+d.data.multi_checked+"/"+d.data.multi_total+" 人"+(d.checked_count?"（本次 "+d.checked_count+" 人）":"");
  if(d.already) info=(info?info+"<br>":"")+"（已签到 · "+esc(formatChinaDateTime(d.data.checked_at))+"）";
  document.getElementById("resultInfo").innerHTML=info||"签到成功";
}

async function submitCheckin(quantity){
  var btn=quantity?document.getElementById("multiBtn"):(pendingEventId?document.getElementById("eventBtn"):document.getElementById("submitBtn"));
  var originalText=btn.textContent;
  btn.disabled=true;btn.textContent=quantity?"签到中...":"验证中...";
  try{
    var payload={name:encodeURIComponent(pendingName),phone:pendingPhone,_e:1};
    if(pendingEventId)payload.event_id=pendingEventId;
    if(quantity)payload.quantity=quantity;
    var r=await fetch(API+"/checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    var d=await r.json();
    if(d.needs_event){
      var eventSelect=document.getElementById("eventSelect");eventSelect.innerHTML="";
      (d.events||[]).forEach(function(item){var option=document.createElement("option");option.value=item.event_id;option.textContent=item.event_date+" · "+item.activity_type_name+" · "+item.name;eventSelect.appendChild(option)});
      document.getElementById("eventPanel").classList.add("show");
      m(d.msg||"请选择活动","success");
    }else if(d.needs_quantity){
      var info=d.data||{},remaining=Number(info.remaining_slots||0);
      document.getElementById("multiText").textContent="该姓名共报名 "+info.total_slots+" 人，已签到 "+info.checked_slots+" 人。请选择本次实际到场人数：";
      var select=document.getElementById("quantitySelect");select.innerHTML="";
      for(var i=1;i<=remaining;i++){var option=document.createElement("option");option.value=i;option.textContent=i+" 人";select.appendChild(option)}
      document.getElementById("multiPanel").classList.add("show");
      m(d.msg||"请选择到场人数","success");
    }else if(d.ok){
      document.getElementById("formCard").style.display="none";
      document.getElementById("multiPanel").classList.remove("show");
      document.getElementById("eventPanel").classList.remove("show");
      document.getElementById("resultCard").classList.add("show");
      document.getElementById("welcomeText").textContent="欢迎 "+d.data.name+"学长！";
      var shGrp=d.data.show_group!=="false",shDin=d.data.show_dinner_table!=="false";
      var seatHtml="";
      if(shGrp && d.data.group_num) seatHtml+='<div class="seat-item">大会现场：第 '+d.data.group_num+' 组</div>';
      if(shDin && d.data.dinner_table_num) seatHtml+='<div class="seat-item">空巴晚宴：第 '+d.data.dinner_table_num+' 桌</div>';
      document.getElementById("seatArea").innerHTML=seatHtml;
      var info="";
      if(d.data.event) info+="活动："+esc(d.data.event.event_date+" · "+d.data.event.activity_type_name+" · "+d.data.event.name)+"<br>";
      if(d.data.group_value) info+=esc(d.data.group_type||"分组")+"："+esc(d.data.group_value)+"<br>";
      else if(d.data.class_name) info+="班级："+esc(d.data.class_name)+"<br>";
      else if(d.data.center) info+="分中心："+esc(d.data.center)+"<br>";
      else if(d.data.group_name) info+="小组："+esc(d.data.group_name)+"<br>";
      if(d.data.company) info+="公司："+esc(d.data.company);
      if(d.data.multi_total>1) info+=(info?"<br>":"")+"多人报名：已签到 "+d.data.multi_checked+"/"+d.data.multi_total+" 人"+(d.checked_count?"（本次 "+d.checked_count+" 人）":"");
      if(d.already) info=(info?info+"<br>":"")+"（已签到 · "+esc(formatChinaDateTime(d.data.checked_at))+"）";
      document.getElementById("resultInfo").innerHTML=info||"签到成功";
    }
    else{m(d.msg,"error");document.getElementById("formCard").style.display="block";}
  }catch(e){m("网络错误","error");document.getElementById("formCard").style.display="block";}
  btn.disabled=false;btn.textContent=originalText;
}
init();
</script>
</body>
</html>
